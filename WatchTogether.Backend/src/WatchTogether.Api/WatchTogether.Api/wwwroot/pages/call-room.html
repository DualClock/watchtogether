<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеозвонок — WatchTogether</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #eef2f7; height: 100vh; overflow: hidden; }
        .call-container { display: flex; height: 100vh; }

        .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: white; border-bottom: 1px solid #e2e8f0; }
        .top-bar h2 { font-size: 1rem; font-weight: 600; color: #1a202c; }
        .room-link-box { display: flex; gap: 8px; background: #f7fafc; padding: 6px 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .room-link-box input { border: none; background: none; font-size: 0.8rem; width: 220px; outline: none; color: #4a5568; }
        .room-link-box button { background: #7c9a6a; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: background 0.2s; }
        .room-link-box button:hover { background: #6b855b; }

        .video-stage { flex: 1; display: flex; align-items: center; justify-content: center; background: #1a202c; position: relative; margin: 16px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.12); }
        .remote-placeholder { text-align: center; color: rgba(255,255,255,0.55); }
        .remote-placeholder svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.5; }
        .remote-placeholder p { font-size: 0.95rem; }
        #remoteVideo { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
        #remoteVideo.has-stream { display: block; image-rendering: auto; }

        .fullscreen-btn { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 12px; background: rgba(0,0,0,0.45); border: none; color: white; cursor: pointer; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: background 0.2s; z-index: 20; }
        .fullscreen-btn:hover { background: rgba(0,0,0,0.65); }
        .fullscreen-btn.visible { display: flex; }

        .local-pip { position: absolute; bottom: 20px; right: 20px; width: 220px; height: 160px; border-radius: 16px; overflow: hidden; background: #2d3748; border: 3px solid white; box-shadow: 0 8px 32px rgba(0,0,0,0.35); z-index: 10; }
        .local-pip video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .local-pip video.active { display: block; }
        .pip-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgba(255,255,255,0.8); gap: 8px; }
        .pip-placeholder .pip-avatar { width: 56px; height: 56px; border-radius: 50%; background: #7c9a6a; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.25rem; }
        .pip-placeholder .pip-label { font-size: 0.75rem; color: rgba(255,255,255,0.6); }

        .call-controls { display: flex; justify-content: center; gap: 16px; padding: 16px; background: white; border-top: 1px solid #e2e8f0; }
        .ctrl-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: #edf2f7; color: #2d3748; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .ctrl-btn:hover { transform: translateY(-2px); background: #e2e8f0; }
        .ctrl-btn.on { background: #7c9a6a; color: white; }
        .ctrl-btn.muted { background: #fc8181; color: white; }
        .ctrl-btn.hangup { background: #f56565; color: white; }
        .ctrl-btn.hangup:hover { background: #e53e3e; }

        .sidebar { width: 340px; background: white; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .sidebar-section { border-bottom: 1px solid #e2e8f0; }
        .sidebar-header { padding: 14px 18px; font-weight: 600; font-size: 0.9rem; color: #1a202c; background: #f7fafc; }
        .participants-list { padding: 10px 16px; max-height: 220px; overflow-y: auto; }
        .participant-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
        .p-avatar { width: 38px; height: 38px; border-radius: 50%; background: #7c9a6a; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
        .p-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .p-info { flex: 1; min-width: 0; }
        .p-name { font-weight: 600; font-size: 0.85rem; color: #1a202c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-role { font-size: 0.75rem; color: #7c9a6a; }
        .p-status { display: flex; gap: 6px; color: #a0aec0; }
        .p-status svg { width: 16px; height: 16px; }
        .p-status .off { color: #cbd5e0; }

        .chat-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 14px; background: #f7fafc; }
        .chat-message { margin-bottom: 10px; }
        .chat-message .msg-author { font-size: 0.75rem; font-weight: 600; color: #4a5568; margin-bottom: 2px; }
        .chat-message .msg-text { font-size: 0.85rem; color: #1a202c; background: white; padding: 8px 12px; border-radius: 12px; border: 1px solid #e2e8f0; display: inline-block; max-width: 100%; word-break: break-word; }
        .chat-message.own .msg-text { background: #7c9a6a; color: white; border-color: #7c9a6a; }
        .chat-message.system { text-align: center; color: #718096; font-size: 0.75rem; margin: 8px 0; }
        .chat-empty { text-align: center; color: #a0aec0; font-size: 0.85rem; padding: 20px; }
        .chat-input-area { padding: 12px 14px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 100px; outline: none; font-size: 0.9rem; }
        .chat-input:focus { border-color: #7c9a6a; }
        .chat-send { width: 40px; height: 40px; border-radius: 50%; background: #7c9a6a; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .chat-send:hover { background: #6b855b; }

        @media (max-width: 900px) { .sidebar { display: none; } .local-pip { width: 130px; height: 95px; } }
    </style>
</head>
<body>
    <div class="call-container">
        <div class="main-area">
            <div class="top-bar">
                <h2 id="roomName">Видеозвонок</h2>
                <div class="room-link-box">
                    <input type="text" id="roomLink" readonly>
                    <button onclick="copyLink()">Копировать</button>
                </div>
            </div>
            <div class="video-stage" id="videoStage">
                <div class="remote-placeholder" id="remotePlaceholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
                    <p>Ожидание участников…</p>
                </div>
                <video id="remoteVideo" autoplay playsinline></video>
                <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="На весь экран">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
                <div class="local-pip" id="localPip">
                    <div class="pip-placeholder" id="pipPlaceholder">
                        <div class="pip-avatar" id="localAvatar">В</div>
                        <div class="pip-label">Камера выключена</div>
                    </div>
                    <video id="localVideo" autoplay muted playsinline></video>
                </div>
            </div>
            <div class="call-controls">
                <button class="ctrl-btn muted" id="btnMic" onclick="toggleMic()" title="Микрофон">
                    <svg id="iconMicOff" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v6a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    <svg id="iconMicOn" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <button class="ctrl-btn muted" id="btnCam" onclick="toggleCam()" title="Камера">
                    <svg id="iconCamOff" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    <svg id="iconCamOn" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </button>
                <button class="ctrl-btn" id="btnScreen" onclick="toggleScreen()" title="Демонстрация экрана">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                </button>
                <button class="ctrl-btn hangup" onclick="hangup()" title="Завершить звонок">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/></svg>
                </button>
            </div>
        </div>
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-header">Участники (<span id="participantCount">1</span>)</div>
                <div class="participants-list" id="participantsList"></div>
            </div>
            <div class="chat-area">
                <div class="sidebar-header">Чат</div>
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-empty">Нет сообщений</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="messageInput" placeholder="Написать сообщение…" maxlength="2000">
                    <button class="chat-send" onclick="sendChatMessage()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/signalr.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');

        if (!roomId) {
            window.location.href = '/pages/rooms.html';
        }

        document.getElementById('roomLink').value = window.location.href;

        // State
        let localStream = null;
        let screenStream = null;
        let isMicOn = false;
        let isCamOn = false;
        let isScreenSharing = false;
        let peers = new Map(); // targetUserId -> RTCPeerConnection
        let participants = new Map(); // userId -> participant info
        let currentUser = null;
        let pendingIceCandidates = new Map(); // targetUserId -> []

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // UI refs
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const pipPlaceholder = document.getElementById('pipPlaceholder');
        const localAvatar = document.getElementById('localAvatar');
        const participantsList = document.getElementById('participantsList');
        const participantCount = document.getElementById('participantCount');
        const chatMessages = document.getElementById('chatMessages');

        async function init() {
            if (!requireAuth()) return;

            try {
                currentUser = await api.getProfile();
                const initial = (currentUser?.displayName || currentUser?.username || 'Вы')[0].toUpperCase();
                localAvatar.textContent = initial;

                const room = await api.getRoom(roomId);
                document.getElementById('roomName').textContent = room?.name || 'Видеозвонок';

                // Add self to participants
                addParticipant({
                    userId: currentUser.id,
                    username: currentUser.username,
                    displayName: currentUser.displayName || currentUser.username,
                    avatarUrl: currentUser.avatarUrl,
                    role: 'Вы',
                    isLocal: true
                });

                // Connect SignalR
                await chatConnection.connect();
                setupSignaling();
                await chatConnection.joinRoom(roomId);

            } catch (error) {
                console.error(error);
                showToast(error.message || 'Не удалось подключиться', 'error');
            }
        }

        function setupSignaling() {
            chatConnection.onMessage((msg) => appendChatMessage(msg));

            chatConnection.onUserJoined((data) => {
                playJoinSound();
                appendSystemMessage(`${data.displayName || data.username} присоединился`);
                addParticipant({
                    userId: data.userId,
                    username: data.username,
                    displayName: data.displayName || data.username,
                    avatarUrl: data.avatarUrl,
                    role: 'Участник'
                });
            });

            chatConnection.onUserLeft((data) => {
                playLeaveSound();
                appendSystemMessage(`${data.displayName || data.username} вышел`);
                removeParticipant(data.userId);
                closePeerConnection(data.userId);
            });

            // Room members list sent on join
            chatConnection.connection.on('RoomMembers', (data) => {
                if (data && Array.isArray(data.members)) {
                    data.members.forEach(m => {
                        if (m.userId !== currentUser?.id) {
                            addParticipant({
                                userId: m.userId,
                                username: m.username,
                                displayName: m.displayName || m.username,
                                avatarUrl: m.avatarUrl,
                                role: m.role === 'Owner' ? 'Организатор' : (m.role === 'Moderator' ? 'Модератор' : 'Участник')
                            });
                        }
                    });
                }
            });

            // WebRTC handlers
            chatConnection.connection.on('ReceiveOffer', async (data) => {
                try {
                    const pc = getOrCreatePeerConnection(data.fromUserId);
                    await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await chatConnection.connection.invoke('SendWebRtcAnswer', roomId, data.fromUserId, answer.sdp);

                    // Flush pending ICE candidates
                    const pending = pendingIceCandidates.get(data.fromUserId) || [];
                    for (const c of pending) {
                        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) { console.error(e); }
                    }
                    pendingIceCandidates.delete(data.fromUserId);
                } catch (err) {
                    console.error('ReceiveOffer error:', err);
                }
            });

            chatConnection.connection.on('ReceiveAnswer', async (data) => {
                try {
                    const pc = peers.get(data.fromUserId);
                    if (pc) {
                        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
                    }
                } catch (err) {
                    console.error('ReceiveAnswer error:', err);
                }
            });

            chatConnection.connection.on('ReceiveIceCandidate', async (data) => {
                try {
                    const pc = peers.get(data.fromUserId);
                    const candidateInit = {
                        candidate: data.candidate,
                        sdpMid: data.sdpMid,
                        sdpMLineIndex: data.sdpMLineIndex
                    };
                    if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                        await pc.addIceCandidate(new RTCIceCandidate(candidateInit));
                    } else {
                        if (!pendingIceCandidates.has(data.fromUserId)) pendingIceCandidates.set(data.fromUserId, []);
                        pendingIceCandidates.get(data.fromUserId).push(candidateInit);
                    }
                } catch (err) {
                    console.error('ReceiveIceCandidate error:', err);
                }
            });
        }

        function getOrCreatePeerConnection(targetUserId) {
            if (peers.has(targetUserId)) return peers.get(targetUserId);

            const pc = new RTCPeerConnection(rtcConfig);
            peers.set(targetUserId, pc);

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            pc.ontrack = (event) => {
                const stream = event.streams[0];
                attachRemoteStream(targetUserId, stream);
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    chatConnection.connection.invoke('SendIceCandidate', roomId, targetUserId,
                        event.candidate.candidate,
                        event.candidate.sdpMid,
                        event.candidate.sdpMLineIndex).catch(console.error);
                }
            };

            pc.onconnectionstatechange = () => {
                console.log(`PC state with ${targetUserId}:`, pc.connectionState);
            };

            return pc;
        }

        function closePeerConnection(userId) {
            const pc = peers.get(userId);
            if (pc) {
                pc.close();
                peers.delete(userId);
            }
            // If no more peers with remote stream, hide remote video
            if (peers.size === 0) {
                remoteVideo.srcObject = null;
                remoteVideo.classList.remove('has-stream');
                remotePlaceholder.style.display = 'block';
                fullscreenBtn.classList.remove('visible');
            }
        }

        async function startLocalMedia() {
            if (localStream) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920, min: 1280 },
                        height: { ideal: 1080, min: 720 },
                        frameRate: { ideal: 60, min: 30 },
                        facingMode: 'user'
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 48000,
                        channelCount: 2
                    }
                });
                localVideo.srcObject = localStream;
                localVideo.classList.add('active');
                pipPlaceholder.style.display = 'none';

                // Add tracks to existing peer connections
                peers.forEach((pc) => {
                    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                });

                // Send offers to all participants
                participants.forEach(async (p) => {
                    if (p.isLocal) return;
                    await sendOffer(p.userId);
                });

                isMicOn = true;
                isCamOn = true;
                updateMediaButtons();
            } catch (err) {
                console.error(err);
                showToast('Не удалось получить доступ к камере/микрофону', 'error');
            }
        }

        async function sendOffer(targetUserId) {
            try {
                const pc = getOrCreatePeerConnection(targetUserId);

                // Request high-quality video encoding
                const transceiver = pc.getTransceivers().find(t => t.sender.track && t.sender.track.kind === 'video');
                if (transceiver) {
                    const params = transceiver.sender.getParameters();
                    if (!params.encodings) params.encodings = [{}];
                    params.encodings[0].maxBitrate = 4000000; // 4 Mbps
                    params.encodings[0].maxFramerate = 60;
                    params.encodings[0].priority = 'high';
                    await transceiver.sender.setParameters(params).catch(() => {});
                }

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await chatConnection.connection.invoke('SendWebRtcOffer', roomId, targetUserId, offer.sdp);
            } catch (err) {
                console.error('sendOffer error:', err);
            }
        }

        function attachRemoteStream(userId, stream) {
            remoteVideo.srcObject = stream;
            remoteVideo.classList.add('has-stream');
            remotePlaceholder.style.display = 'none';
            fullscreenBtn.classList.add('visible');
        }

        function toggleMic() {
            if (!localStream) {
                // If no stream yet, start media then toggle
                startLocalMedia();
                return;
            }
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                isMicOn = audioTrack.enabled;
                updateMediaButtons();
            }
        }

        function toggleCam() {
            if (!localStream) {
                startLocalMedia();
                return;
            }
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                isCamOn = videoTrack.enabled;
                updateMediaButtons();
            }
        }

        function updateMediaButtons() {
            const micBtn = document.getElementById('btnMic');
            const camBtn = document.getElementById('btnCam');

            micBtn.classList.toggle('on', isMicOn);
            micBtn.classList.toggle('muted', !isMicOn);
            document.getElementById('iconMicOn').style.display = isMicOn ? 'block' : 'none';
            document.getElementById('iconMicOff').style.display = isMicOn ? 'none' : 'block';

            camBtn.classList.toggle('on', isCamOn);
            camBtn.classList.toggle('muted', !isCamOn);
            document.getElementById('iconCamOn').style.display = isCamOn ? 'block' : 'none';
            document.getElementById('iconCamOff').style.display = isCamOn ? 'none' : 'block';

            updateParticipantStatus(currentUser?.id, { mic: isMicOn, cam: isCamOn });
        }

        async function toggleScreen() {
            const btn = document.getElementById('btnScreen');
            if (isScreenSharing) {
                if (screenStream) {
                    screenStream.getTracks().forEach(t => t.stop());
                    screenStream = null;
                }
                if (localStream) {
                    localVideo.srcObject = localStream;
                    const videoTrack = localStream.getVideoTracks()[0];
                    if (videoTrack) {
                        videoTrack.enabled = isCamOn;
                        peers.forEach(pc => {
                            const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                            if (sender) sender.replaceTrack(videoTrack).catch(console.error);
                        });
                    }
                }
                btn.classList.remove('on');
                isScreenSharing = false;
            } else {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: {
                            width: { ideal: 1920 },
                            height: { ideal: 1080 },
                            frameRate: { ideal: 60 }
                        },
                        audio: true
                    });
                    localVideo.srcObject = screenStream;
                    const videoTrack = screenStream.getVideoTracks()[0];
                    videoTrack.onended = () => toggleScreen();

                    peers.forEach(pc => {
                        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(videoTrack).catch(console.error);
                    });

                    btn.classList.add('on');
                    isScreenSharing = true;
                } catch (err) {
                    showToast('Не удалось начать демонстрацию экрана', 'error');
                }
            }
        }

        function hangup() {
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
            peers.forEach(pc => pc.close());
            peers.clear();
            chatConnection.leaveRoom(roomId).catch(() => {});
            chatConnection.disconnect().catch(() => {});
            window.location.href = '/pages/rooms.html';
        }

        function copyLink() {
            const input = document.getElementById('roomLink');
            input.select();
            if (navigator.clipboard) {
                navigator.clipboard.writeText(input.value).then(() => showToast('Ссылка скопирована!', 'success'));
            } else {
                document.execCommand('copy');
                showToast('Ссылка скопирована!', 'success');
            }
        }

        function toggleFullscreen() {
            const video = document.getElementById('remoteVideo');
            if (!document.fullscreenElement) {
                video.requestFullscreen?.().catch(() => {});
            } else {
                document.exitFullscreen?.().catch(() => {});
            }
        }

        // Participants
        function addParticipant(p) {
            participants.set(p.userId, p);
            renderParticipants();
        }

        function removeParticipant(userId) {
            participants.delete(userId);
            renderParticipants();
        }

        function updateParticipantStatus(userId, status) {
            const p = participants.get(userId);
            if (p) {
                p.mic = status.mic;
                p.cam = status.cam;
                renderParticipants();
            }
        }

        function renderParticipants() {
            participantCount.textContent = participants.size;
            if (participants.size === 0) {
                participantsList.innerHTML = '<div style="color:#a0aec0;font-size:0.8rem;padding:6px 0;">Нет участников</div>';
                return;
            }
            participantsList.innerHTML = Array.from(participants.values()).map(p => {
                const initial = (p.displayName || p.username || '?')[0].toUpperCase();
                const micClass = p.mic ? '' : 'off';
                const camClass = p.cam ? '' : 'off';
                return `
                    <div class="participant-item" data-userid="${p.userId}">
                        <div class="p-avatar">
                            ${p.avatarUrl ? `<img src="${p.avatarUrl}" alt="">` : initial}
                        </div>
                        <div class="p-info">
                            <div class="p-name">${escapeHtml(p.displayName || p.username)} ${p.isLocal ? '(Вы)' : ''}</div>
                            <div class="p-role">${p.role}</div>
                        </div>
                        <div class="p-status">
                            <svg class="${micClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                            <svg class="${camClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Chat
        function appendChatMessage(msg) {
            const empty = chatMessages.querySelector('.chat-empty');
            if (empty) empty.remove();

            const isOwn = msg.userId === currentUser?.id;
            const el = document.createElement('div');
            el.className = `chat-message ${isOwn ? 'own' : ''}`;
            el.innerHTML = `
                <div class="msg-author">${escapeHtml(msg.username)}</div>
                <div class="msg-text">${escapeHtml(msg.content)}</div>
            `;
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendSystemMessage(text) {
            const empty = chatMessages.querySelector('.chat-empty');
            if (empty) empty.remove();
            const el = document.createElement('div');
            el.className = 'chat-message system';
            el.textContent = text;
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendChatMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;
            input.value = '';
            try {
                await chatConnection.sendMessage(content);
            } catch (error) {
                showToast('Не удалось отправить сообщение', 'error');
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        // Sound effects using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(frequencyStart, frequencyEnd, duration, type = 'sine') {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(frequencyStart, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(frequencyEnd, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playJoinSound() {
            playTone(523.25, 783.99, 0.25); // C5 -> G5
        }

        function playLeaveSound() {
            playTone(783.99, 523.25, 0.25); // G5 -> C5
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('beforeunload', () => {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (screenStream) screenStream.getTracks().forEach(t => t.stop());
            chatConnection.leaveRoom(roomId).catch(() => {});
        });

        init();
    </script>
</body>
</html>
