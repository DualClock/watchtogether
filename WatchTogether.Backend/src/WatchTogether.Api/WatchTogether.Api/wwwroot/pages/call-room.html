<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеозвонок — WatchTogether</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .call-page {
            min-height: 100vh;
            background: #0f0f0f;
            display: flex;
            flex-direction: column;
        }
        
        .call-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .call-header h2 {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .call-header .room-link {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .call-header input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            width: 280px;
        }
        
        .call-header button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .call-header button:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 12px;
            padding: 16px;
            align-content: center;
        }
        
        .video-tile {
            position: relative;
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-tile .avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: white;
        }
        
        .video-tile .tile-name {
            position: absolute;
            bottom: 12px;
            left: 12px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 8px;
        }
        
        .video-tile .tile-mute {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .call-controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        
        .ctrl-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .ctrl-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        
        .ctrl-btn.on {
            background: var(--accent);
        }
        
        .ctrl-btn.muted {
            background: #c05050;
        }
        
        .ctrl-btn.hangup {
            background: #c05050;
        }
        
        .ctrl-btn.hangup:hover {
            background: #a04040;
        }
        
        .ctrl-btn svg {
            width: 24px;
            height: 24px;
        }
        
        .chat-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 320px;
            background: rgba(15,15,15,0.95);
            border-left: 1px solid rgba(255,255,255,0.05);
            transform: translateX(100%);
            transition: transform 0.3s;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        
        .chat-sidebar.open {
            transform: translateX(0);
        }
        
        .chat-toggle {
            position: fixed;
            right: 24px;
            bottom: 100px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            
            .call-header input {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="call-page">
        <div class="call-header">
            <h2 id="roomName">Видеозвонок</h2>
            <div class="room-link">
                <input type="text" id="roomLink" readonly>
                <button onclick="copyLink()">Копировать</button>
            </div>
        </div>
        
        <div class="video-grid" id="videoGrid">
            <!-- Local video -->
            <div class="video-tile" id="localTile">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="tile-name">Вы</div>
            </div>
        </div>
        
        <div class="call-controls">
            <button class="ctrl-btn" id="btnMic" onclick="toggleMic()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
            <button class="ctrl-btn" id="btnCam" onclick="toggleCam()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </button>
            <button class="ctrl-btn" id="btnScreen" onclick="toggleScreen()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
            </button>
            <button class="ctrl-btn hangup" onclick="hangup()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Chat toggle -->
    <button class="chat-toggle" onclick="toggleChat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
    </button>
    
    <!-- Chat sidebar -->
    <div class="chat-sidebar" id="chatSidebar">
        <div class="chat-header" style="border-bottom:1px solid rgba(255,255,255,0.1);">
            <h3 style="color:white;">Чат</h3>
            <button onclick="toggleChat()" style="background:none;border:none;color:white;cursor:pointer;font-size:1.2rem;">&times;</button>
        </div>
        <div class="chat-messages" id="chatMessages" style="background:transparent;"></div>
        <div class="chat-input-area" style="border-top:1px solid rgba(255,255,255,0.1);">
            <input type="text" class="chat-input" id="messageInput" placeholder="Сообщение..." style="background:rgba(255,255,255,0.1);border:none;color:white;">
            <button class="chat-send-btn" onclick="sendChatMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/signalr.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');
        
        if (!roomId) {
            window.location.href = 'rooms.html';
        }
        
        // Set room link
        document.getElementById('roomLink').value = window.location.href;
        
        let localStream = null;
        let screenStream = null;
        let isMicOn = true;
        let isCamOn = true;
        let isScreenSharing = false;
        let peers = new Map(); // userId -> RTCPeerConnection
        
        // WebRTC configuration
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        async function init() {
            if (!requireAuth()) return;
            
            try {
                // Get room info
                const room = await api.getRoom(roomId);
                document.getElementById('roomName').textContent = room.name || 'Видеозвонок';
                
                // Start local media
                await startLocalMedia();
                
                // Connect to SignalR for signaling
                await chatConnection.connect();
                await chatConnection.joinRoom(roomId);
                
                setupSignaling();
                
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
        
        async function startLocalMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                showToast('Не удалось получить доступ к камере/микрофону', 'error');
                console.error(err);
            }
        }
        
        function setupSignaling() {
            // Handle incoming offers/answers/ICE candidates via SignalR
            // This is simplified - full implementation would need server-side signaling
            
            chatConnection.onUserJoined((data) => {
                if (data.userId !== currentUser?.id) {
                    createPeerConnection(data.userId);
                }
            });
        }
        
        function createPeerConnection(userId) {
            const pc = new RTCPeerConnection(rtcConfig);
            peers.set(userId, pc);
            
            // Add local stream
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });
            
            // Handle remote stream
            pc.ontrack = (event) => {
                addRemoteVideo(userId, event.streams[0]);
            };
            
            return pc;
        }
        
        function addRemoteVideo(userId, stream) {
            const tileId = `remote-${userId}`;
            let tile = document.getElementById(tileId);
            
            if (!tile) {
                tile = document.createElement('div');
                tile.className = 'video-tile';
                tile.id = tileId;
                tile.innerHTML = `
                    <video autoplay playsinline></video>
                    <div class="tile-name">Участник</div>
                `;
                document.getElementById('videoGrid').appendChild(tile);
            }
            
            const video = tile.querySelector('video');
            video.srcObject = stream;
        }
        
        function toggleMic() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                isMicOn = audioTrack.enabled;
                document.getElementById('btnMic').classList.toggle('muted', !isMicOn);
            }
        }
        
        function toggleCam() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                isCamOn = videoTrack.enabled;
                document.getElementById('btnCam').classList.toggle('muted', !isCamOn);
            }
        }
        
        async function toggleScreen() {
            if (isScreenSharing) {
                // Stop screen sharing
                if (screenStream) {
                    screenStream.getTracks().forEach(t => t.stop());
                    screenStream = null;
                }
                
                // Restore camera
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) videoTrack.enabled = true;
                
                document.getElementById('btnScreen').classList.remove('on');
                isScreenSharing = false;
            } else {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: true,
                        audio: true
                    });
                    
                    const videoTrack = screenStream.getVideoTracks()[0];
                    document.getElementById('localVideo').srcObject = screenStream;
                    
                    // Handle screen share end
                    videoTrack.onended = () => {
                        toggleScreen();
                    };
                    
                    document.getElementById('btnScreen').classList.add('on');
                    isScreenSharing = true;
                } catch (err) {
                    showToast('Не удалось начать демонстрацию экрана', 'error');
                }
            }
        }
        
        function hangup() {
            // Stop all streams
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
            }
            
            // Close all peer connections
            peers.forEach(pc => pc.close());
            peers.clear();
            
            // Leave room
            chatConnection.leaveRoom(roomId);
            
            window.location.href = 'rooms.html';
        }
        
        function copyLink() {
            const input = document.getElementById('roomLink');
            input.select();
            document.execCommand('copy');
            showToast('Ссылка скопирована!', 'success');
        }
        
        function toggleChat() {
            document.getElementById('chatSidebar').classList.toggle('open');
        }
        
        function sendChatMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;
            input.value = '';
            chatConnection.sendMessage(content);
        }
        
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });
        
        // Chat handlers
        chatConnection.onMessage((msg) => {
            const container = document.getElementById('chatMessages');
            const el = document.createElement('div');
            el.className = 'message';
            el.style.color = 'white';
            el.innerHTML = `
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-author">${msg.username}</span>
                    </div>
                    <div class="message-text">${msg.content}</div>
                </div>
            `;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        });
        
        let currentUser = null;
        
        init();
    </script>
</body>
</html>
