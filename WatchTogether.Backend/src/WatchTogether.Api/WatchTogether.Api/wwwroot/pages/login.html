<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — WatchTogether</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Вход в аккаунт</h1>
                <p>С возвращением! Войдите, чтобы продолжить</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-input" id="password" placeholder="Ваш пароль" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
                    <span class="btn-text">Войти</span>
                </button>
            </form>

            <div class="auth-footer">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        if (redirectIfAuth()) {
            // Already authenticated, redirecting...
        }

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.querySelector('.btn-text').textContent = 'Вход...';

            try {
                await api.login({
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value
                });

                showToast('Вход выполнен!', 'success');
                setTimeout(() => {
                    window.location.href = 'rooms.html';
                }, 500);
            } catch (error) {
                showToast(error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.querySelector('.btn-text').textContent = 'Войти';
            }
        });
    </script>
</body>
</html>
