<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната — WatchTogether</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <header class="navbar"></header>

        <main class="container">
            <div class="room-layout">
                <!-- Video Section -->
                <div class="video-section">
                    <div class="video-container" id="videoContainer">
                        <!-- Video Player -->
                        <video id="videoPlayer" class="hidden" controls></video>
                        
                        <!-- YouTube Player -->
                        <div id="youtubePlayer" class="hidden" style="width:100%; height:100%;">
                            <iframe id="youtubeIframe" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
                        </div>
                        
                        <!-- Placeholder when no video -->
                        <div class="video-placeholder" id="videoPlaceholder">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="2" y="2" width="20" height="20" rx="2.18"></rect>
                                <line x1="7" y1="2" x2="7" y2="22"></line>
                                <line x1="17" y1="2" x2="17" y2="22"></line>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <line x1="2" y1="7" x2="7" y2="7"></line>
                                <line x1="2" y1="17" x2="7" y2="17"></line>
                                <line x1="17" y1="17" x2="22" y2="17"></line>
                                <line x1="17" y1="7" x2="22" y2="7"></line>
                            </svg>
                            <p>Видео не выбрано</p>
                            <div id="adminControls" class="hidden">
                                <button class="btn btn-primary mt-2" onclick="document.getElementById('videoInput').click()">
                                    Загрузить видео
                                </button>
                                <button class="btn btn-secondary mt-2" onclick="showUrlInput()">
                                    Добавить ссылку
                                </button>
                            </div>
                            <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="handleVideoUpload(this)">
                        </div>
                    </div>

                    <!-- Admin: Change video URL -->
                    <div class="video-url-input hidden" id="urlInputContainer">
                        <input type="text" id="newVideoUrl" placeholder="Вставьте ссылку на видео..." class="form-input">
                        <button class="btn btn-primary" onclick="changeVideoUrl()">Применить</button>
                        <button class="btn btn-secondary" onclick="hideUrlInput()">Отмена</button>
                    </div>

                    <!-- Video Info -->
                    <div class="video-info" id="videoInfo">
                        <span id="videoStatus">Ожидание видео...</span>
                        <span id="adminBadge" class="hidden" style="color: var(--primary);">👑 Вы админ</span>
                    </div>
                </div>

                <!-- Chat Section -->
                <div class="chat-section">
                    <div class="chat-header">
                        <h3 id="roomName">Загрузка...</h3>
                        <span class="chat-members-count" id="membersCount">0 участников</span>
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <div class="empty-state">
                            <p>Нет сообщений</p>
                            <p style="font-size: 0.85rem;">Будьте первым!</p>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <input type="text" class="chat-input" id="messageInput" placeholder="Написать сообщение..." maxlength="2000">
                        <button class="chat-send-btn" onclick="sendMessage()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/signalr.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');

        if (!roomId) {
            window.location.href = 'rooms.html';
        }

        let room = null;
        let messages = [];
        let isAdmin = false;
        let currentUser = null;
        let isSyncing = false;

        const videoPlayer = document.getElementById('videoPlayer');
        const youtubePlayer = document.getElementById('youtubePlayer');
        const youtubeIframe = document.getElementById('youtubeIframe');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const adminControls = document.getElementById('adminControls');
        const adminBadge = document.getElementById('adminBadge');
        const videoStatus = document.getElementById('videoStatus');

        async function init() {
            if (!requireAuth()) return;

            try {
                // Get current user
                currentUser = await api.getProfile();

                // Load room
                room = await api.getRoom(roomId);
                document.getElementById('roomName').textContent = room.name;
                document.getElementById('membersCount').textContent = `${room.members?.length || 0} участников`;

                // Check if user is admin (owner or moderator)
                const myMember = room.members?.find(m => m.userId === currentUser.id);
                isAdmin = myMember?.role === 'owner' || myMember?.role === 'moderator';
                
                if (isAdmin) {
                    adminControls.classList.remove('hidden');
                    adminBadge.classList.remove('hidden');
                }

                // Load video if exists
                if (room.currentVideoUrl) {
                    loadVideo(room.currentVideoUrl, room.currentVideoType, room.videoCurrentTime || 0);
                }

                // Load messages
                await loadMessages();

                // Connect SignalR
                await chatConnection.connect();
                await chatConnection.joinRoom(roomId);

                await videoConnection.connect();
                await videoConnection.joinRoom(roomId);

                setupChatHandlers();
                setupVideoHandlers();

            } catch (error) {
                showToast(error.message, 'error');
                setTimeout(() => window.location.href = 'rooms.html', 2000);
            }
        }

        function loadVideo(url, type, startTime = 0) {
            videoPlaceholder.classList.add('hidden');
            
            if (isYouTubeUrl(url)) {
                // YouTube
                videoPlayer.classList.add('hidden');
                youtubePlayer.classList.remove('hidden');
                const videoId = extractYouTubeId(url);
                youtubeIframe.src = `https://www.youtube.com/embed/${videoId}?start=${Math.floor(startTime)}&enablejsapi=1`;
                videoStatus.textContent = 'YouTube видео';
            } else if (url.startsWith('http')) {
                // Direct URL
                youtubePlayer.classList.add('hidden');
                videoPlayer.classList.remove('hidden');
                videoPlayer.src = url;
                videoPlayer.currentTime = startTime;
                videoStatus.textContent = 'Внешнее видео';
            } else {
                // Local file
                youtubePlayer.classList.add('hidden');
                videoPlayer.classList.remove('hidden');
                videoPlayer.src = url;
                videoPlayer.currentTime = startTime;
                videoStatus.textContent = 'Локальное видео';
            }
        }

        function isYouTubeUrl(url) {
            return url && (url.includes('youtube.com') || url.includes('youtu.be'));
        }

        function extractYouTubeId(url) {
            const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
            return match ? match[1] : '';
        }

        async function loadMessages() {
            try {
                messages = await api.getMessages(roomId);
                renderMessages();
            } catch (error) {
                console.error('Failed to load messages:', error);
            }
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');

            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>Нет сообщений</p>
                        <p style="font-size: 0.85rem;">Будьте первым!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => `
                <div class="message" data-id="${msg.id}">
                    <div class="message-avatar" style="background: ${stringToColor(msg.username)}">
                        ${msg.username?.[0]?.toUpperCase() || '?'}
                    </div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-author">${escapeHtml(msg.username)}</span>
                            <span class="message-time">${formatTime(msg.createdAt)}</span>
                        </div>
                        <div class="message-text">${escapeHtml(msg.content)}</div>
                    </div>
                </div>
            `).join('');

            scrollToBottom();
        }

        function appendMessage(msg) {
            const container = document.getElementById('chatMessages');
            if (container.querySelector('.empty-state')) {
                container.innerHTML = '';
            }

            const messageEl = document.createElement('div');
            messageEl.className = 'message';
            messageEl.innerHTML = `
                <div class="message-avatar" style="background: ${stringToColor(msg.username)}">
                    ${msg.username?.[0]?.toUpperCase() || '?'}
                </div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-author">${escapeHtml(msg.username)}</span>
                        <span class="message-time">${formatTime(msg.createdAt)}</span>
                    </div>
                    <div class="message-text">${escapeHtml(msg.content)}</div>
                </div>
            `;
            container.appendChild(messageEl);
            scrollToBottom();
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            if (container.querySelector('.empty-state')) {
                container.innerHTML = '';
            }

            const el = document.createElement('div');
            el.className = 'message-system';
            el.textContent = text;
            container.appendChild(el);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        function setupChatHandlers() {
            chatConnection.onMessage((msg) => {
                appendMessage(msg);
            });

            chatConnection.onUserJoined((data) => {
                appendSystemMessage(`${data.username} присоединился`);
            });

            chatConnection.onUserLeft((data) => {
                appendSystemMessage(`${data.username} вышел`);
            });
        }

        function setupVideoHandlers() {
            // Only admin sends events, everyone receives
            if (isAdmin) {
                videoPlayer.addEventListener('play', async () => {
                    if (isSyncing) return;
                    await videoConnection.play(videoPlayer.currentTime);
                });

                videoPlayer.addEventListener('pause', async () => {
                    if (isSyncing) return;
                    await videoConnection.pause(videoPlayer.currentTime);
                });

                videoPlayer.addEventListener('seeked', async () => {
                    if (isSyncing) return;
                    await videoConnection.seek(videoPlayer.currentTime);
                });
            }

            // Everyone receives sync events
            videoConnection.onPlay((data) => {
                if (isAdmin) return;
                isSyncing = true;
                videoPlayer.currentTime = data.currentTime;
                videoPlayer.play();
                isSyncing = false;
            });

            videoConnection.onPause((data) => {
                if (isAdmin) return;
                isSyncing = true;
                videoPlayer.currentTime = data.currentTime;
                videoPlayer.pause();
                isSyncing = false;
            });

            videoConnection.onSeek((data) => {
                if (isAdmin) return;
                isSyncing = true;
                videoPlayer.currentTime = data.currentTime;
                isSyncing = false;
            });

            videoConnection.onSync((state) => {
                if (!state.videoUrl) return;
                loadVideo(state.videoUrl, state.videoType, state.currentTime);
                if (state.isPlaying) {
                    videoPlayer.play();
                } else {
                    videoPlayer.pause();
                }
            });

            videoConnection.onChange((data) => {
                loadVideo(data.videoUrl, data.videoType, 0);
            });
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;

            input.value = '';
            try {
                await chatConnection.sendMessage(content);
            } catch (error) {
                showToast('Не удалось отправить сообщение', 'error');
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Admin: Change video
        function showUrlInput() {
            document.getElementById('urlInputContainer').classList.remove('hidden');
        }

        function hideUrlInput() {
            document.getElementById('urlInputContainer').classList.add('hidden');
        }

        async function changeVideoUrl() {
            const url = document.getElementById('newVideoUrl').value.trim();
            if (!url) return;

            const type = isYouTubeUrl(url) ? 'youtube' : 'url';
            await videoConnection.changeVideo(roomId, url, type);
            loadVideo(url, type, 0);
            hideUrlInput();
        }

        // Admin: Upload video file
        async function handleVideoUpload(input) {
            const file = input.files[0];
            if (!file) return;

            showToast('Загрузка видео...', 'success');
            
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(`${API_BASE_URL}/api/videos/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
                    },
                    body: formData
                });
                
                if (!response.ok) throw new Error('Upload failed');
                const result = await response.json();
                
                await videoConnection.changeVideo(roomId, result.url, 'file');
                loadVideo(result.url, 'file', 0);
            } catch (err) {
                showToast('Не удалось загрузить видео: ' + err.message, 'error');
            }
        }

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 70%, 45%)`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Leave room on page unload
        window.addEventListener('beforeunload', () => {
            chatConnection.leaveRoom(roomId);
            videoConnection.leaveRoom(roomId);
        });

        init();
    </script>
</body>
</html>
